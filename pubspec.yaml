name: counter
description: A Flutter counter app using Clean Architecture with Bloc.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  equatable: ^2.0.5
  flutter_secure_storage: ^9.0.0
  json_annotation: ^4.8.1
  intl: ^0.18.1

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true